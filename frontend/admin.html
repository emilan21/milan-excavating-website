<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Visitor Dashboard | Milan's Excavating</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/styles.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div>
            <strong>Milan's Excavating</strong>
            <span>Visitor Dashboard</span>
        </div>
        <a href="/">View website</a>
    </header>
    <main class="admin-shell">
        <div class="admin-message" id="admin-message" role="status" aria-live="polite"></div>
        <section id="admin-dashboard">
            <div class="stat-grid" aria-label="Dashboard totals">
                <div class="stat-card"><span>Lifetime visits</span><strong id="stat-visits">0</strong></div>
            </div>
            <div class="admin-grid">
                <section class="admin-panel visits-panel">
                    <h2>Recent daily visits</h2>
                    <table class="visits-table">
                        <thead><tr><th>Date</th><th>Visits</th></tr></thead>
                        <tbody id="daily-visits-body"></tbody>
                    </table>
                </section>
            </div>
            <div class="admin-actions">
                <button class="primary-button" id="admin-refresh" type="button">Refresh</button>
                <a class="primary-button" id="admin-logout" href="/cdn-cgi/access/logout">Sign out</a>
            </div>
        </section>
    </main>
    <script src="js/runtime-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
