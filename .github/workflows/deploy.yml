name: Test and deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser tests
        run: |
          python3 -m http.server 8000 --directory frontend >/tmp/milan-pages.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8000 >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8000 >/dev/null
          npm run test:e2e
      - name: Validate HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: frontend/
          arguments: --ignore-status-codes 999,403 --ignore-urls "/localhost/"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Pages
        run: npm run deploy:pages
