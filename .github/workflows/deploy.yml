name: Test and deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm test
      - run: npm run test:d1
      - run: npm run typecheck
      - run: npm run build
      - name: Browser tests
        run: |
          python3 -m http.server 8000 --directory frontend >/tmp/milan-pages.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8000 >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8000 >/dev/null
          npm run test:e2e
      - name: Validate HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: frontend/
          arguments: --ignore-status-codes 999,403 --ignore-urls "/localhost/,/cdn-cgi/access/logout"
      - name: Validate Worker package
        run: WRANGLER_LOG_PATH=/tmp/wrangler.log npx wrangler deploy --env= --dry-run --config worker/wrangler.jsonc

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production assets
        run: npm run build
      - name: Apply pending D1 migrations
        run: npm run db:migrate:remote
      - name: Update Worker Access configuration
        run: |
          jq -n --arg team "$ACCESS_TEAM_DOMAIN" --arg aud "$ACCESS_AUD" --arg email "$ADMIN_EMAIL" \
            '{ACCESS_TEAM_DOMAIN: $team, ACCESS_AUD: $aud, ADMIN_EMAIL: $email}' |
            npx wrangler secret bulk --env= --config worker/wrangler.jsonc
      - name: Deploy analytics Worker
        run: npm run deploy:worker
      - name: Deploy Pages
        run: npm run deploy:pages
